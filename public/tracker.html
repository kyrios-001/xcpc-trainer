<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XCPC 训练台 · ICPC/CCPC 追踪</title>
<link rel="stylesheet" href="/css/style.css?v=10">
</head>
<body>
<div class="topbar">
  <span class="brand">XCPC<b>训练台</b></span>
  <nav class="nav"></nav>
  <span class="spacer"></span>
  <select id="themeSel" style="width:96px">
    <option value="dark">暗色</option><option value="light">亮色</option>
    <option value="gray">灰色</option><option value="eye">护眼</option>
  </select>
</div>

<div class="container">
  <div class="card">
    <h2>补题总览</h2>
    <div id="overallBox" class="stat-grid"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">赛事目录</h2>
      <div class="row">
        <select id="fSeries">
          <option value="">全部系列</option><option value="ICPC">ICPC</option>
          <option value="CCPC">CCPC</option>
        </select>
        <select id="fYear">
          <option value="">全部年份</option>
        </select>
        <input type="text" id="fSite" placeholder="赛站关键词" style="width:120px">
        <select id="fProgress">
          <option value="">全部进度</option><option value="done">有 AC</option>
          <option value="partial">部分 AC</option><option value="todo">未补</option>
        </select>
        <button class="btn primary sm" id="btnAddContest">+ 新增赛事</button>
      </div>
    </div>
    <div class="muted small mb">内置参考目录（站点/年份为公开信息，题数为参考值，以官方公布为准）。题目完成状态来自本地记录，可自动匹配洛谷已做或手动标记；无法获取的提交不会被推断为 AC。</div>
    <div id="setsBox"></div>
  </div>
</div>

<div class="modal-mask" id="contestModal">
  <div class="modal">
    <h2>赛事信息</h2>
    <div class="grid cols-2">
      <div class="field"><label>系列</label>
        <select id="mSeries"><option>ICPC</option><option>CCPC</option><option>省赛</option><option>邀请赛</option></select>
      </div>
      <div class="field"><label>年份</label><input type="number" id="mYear" min="2015" max="2030"></div>
      <div class="field"><label>赛站</label><input type="text" id="mSite"></div>
      <div class="field"><label>比赛名称</label><input type="text" id="mName"></div>
      <div class="field"><label>日期（可空）</label><input type="text" id="mDate" placeholder="YYYY-MM-DD"></div>
      <div class="field"><label>题数（参考值）</label><input type="number" id="mCount" min="1" max="20"></div>
      <div class="field" style="grid-column:1/-1"><label>链接（可空）</label><input type="text" id="mLink"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="mSave">保存</button>
      <button class="btn" id="mCancel">取消</button>
      <input type="hidden" id="mId">
    </div>
  </div>
</div>

<script src="/js/common.js?v=10"></script>
<script src="/js/tracker.js?v=10"></script>
</body>
</html>
